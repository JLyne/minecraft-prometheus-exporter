[versions]
pluginYmlPaper = "0.9.0"
paperApi = "26.1.2.build.+"
prometheus = "1.5.1"
junit = "5.10.1"
velocityApi = "3.5.0-SNAPSHOT"
platformDetection = "2.2"
shadow = "9.4.1"

[libraries]
paperApi = { group = "io.papermc.paper", name = "paper-api", version.ref = "paperApi" }
velocityApi = { group = "com.velocitypowered", name = "velocity-api", version.ref="velocityApi" }
prometheusJVM = { group = "io.prometheus", name = "prometheus-metrics-instrumentation-jvm", version.ref="prometheus" }
prometheusCore = { group = "io.prometheus", name = "prometheus-metrics-core", version.ref="prometheus" }
prometheusExporterHttp = { group = "io.prometheus", name = "prometheus-metrics-exporter-httpserver", version.ref="prometheus" }
junit = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref="junit" }
platformDetectionVelocity = { group = "uk.co.notnull", name = "PlatformDetection-velocity", version.ref="platformDetection" }

[plugins]
pluginYmlPaper = { id = "de.eldoria.plugin-yml.paper", version.ref = "pluginYmlPaper" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }